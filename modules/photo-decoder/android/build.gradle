plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.photodecoder'
version = '0.1.0'

android {
  namespace "expo.modules.photodecoder"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles "proguard-rules.pro"
  }
}

dependencies {
  implementation "androidx.exifinterface:exifinterface:1.4.2"
}
