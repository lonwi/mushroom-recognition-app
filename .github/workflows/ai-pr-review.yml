name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - rewrite/greenfield

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI Architectural Review
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run AI Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) {
              console.log('ℹ️ GEMINI_API_KEY is not configured in repository secrets. Skipping AI code review.');
              console.log('To enable automated AI PR reviews, add GEMINI_API_KEY in Repository Settings -> Secrets and variables -> Actions.');
              return;
            }

            const fs = require('fs');
            const agentsMd = fs.existsSync('AGENTS.md') ? fs.readFileSync('AGENTS.md', 'utf8') : '';

            // Pobierz diff PR
            const { data: diff } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              mediaType: { format: 'diff' }
            });

            if (!diff || diff.length === 0) {
              console.log('Brak zmian w diffie do zrecenzowania.');
              return;
            }

            // Ogranicz wielkość diffa dla promptu
            const truncatedDiff = diff.length > 50000 ? diff.substring(0, 50000) + '\n... [diff truncated]' : diff;

            const systemInstruction = `Jesteś rygorystycznym recenzentem kodu w projekcie Grzybobranie AI (aplikacja mobilna React Native / Expo do rozpoznawania grzybów).
            Twoim zadaniem jest sprawdzenie zmian pod kątem wytycznych projektu:
            1. BEZPIECZEŃSTWO ŻYCIA (Life-Safety):
               - Model NIGDY nie orzeka o jadalności (brak pól jadalności w wyjściu inferencji).
               - Kategoria CONDITIONALLY_EDIBLE NIGDY nie ma koloru zielonego ani przepisów obróbki kulinarnej.
               - Sobowtóry z gatunkami śmiertelnie trującymi muszą mieć fatal: true.
               - Numery alarmowe mogą znajdować się WYŁĄCZNIE w src/core/safety/emergency-contacts.ts.
            2. CZYSTOŚĆ 5 WARSTW ARCHITEKTURY:
               - src/core musi być czystym TypeScriptem (ZERO importów react, react-native, expo, ui, screens, infra).
               - Platform.OS i Platform.select dozwolone WYŁĄCZNIE w src/infra/platform/.
               - Zakaz API tylko dla Androida/iOS (np. BackHandler, ToastAndroid).
               - SafeAreaView importowany wyłącznie z react-native-safe-area-context.
            3. JAKOŚĆ I BRAK WYCISZEŃ:
               - Zakaz komentarzy eslint-disable.
               - Zakaz baseline'ów i luzowania progów w knip/jscpd.
            4. LICENCJE:
               - Zdjęcia w UI wyłącznie CC0 i CC BY z pełną atrybucją.
            5. UI & JĘZYK:
               - Tokeny z src/ui/tokens.ts.
               - Teksty zdefiniowane w src/core/i18n/pl.ts (zakaz hardkodowania stringów w widokach).

            Zwróć odpowiedź w formacie JSON:
            {
              "summary": "Krótkie podsumowanie recenzji po polsku (2-4 zdania).",
              "concerns": [
                {
                  "severity": "CRITICAL" | "WARNING" | "NOTE",
                  "file": "ścieżka/do/pliku",
                  "message": "Opis problemu i jak go naprawić"
                }
              ]
            }`;

            const userPrompt = `Zrecenzuj poniższy Pull Request:\nTytuł: ${context.payload.pull_request.title}\n\nDiff:\n${truncatedDiff}`;

            try {
              const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
                {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    systemInstruction: { parts: [{ text: systemInstruction }] },
                    contents: [{ parts: [{ text: userPrompt }] }],
                    generationConfig: { responseMimeType: 'application/json' }
                  })
                }
              );

              if (!response.ok) {
                console.error(`Błąd API Gemini: ${response.status} ${response.statusText}`);
                return;
              }

              const data = await response.json();
              const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
              if (!text) {
                console.log('Pusta odpowiedź z modelu.');
                return;
              }

              const result = JSON.parse(text);
              const header = '### 🤖 Grzybobranie AI — Recenzja Architektury i Zasad';
              let commentBody = `${header}\n\n${result.summary}\n\n`;

              if (result.concerns && result.concerns.length > 0) {
                commentBody += `#### Zidentyfikowane uwagi:\n\n`;
                for (const item of result.concerns) {
                  const icon = item.severity === 'CRITICAL' ? '🚨 **[KRYTYCZNE]**' : item.severity === 'WARNING' ? '⚠️ **[OSTRZEŻENIE]**' : '💡 **[SUGESTIA]**';
                  commentBody += `- ${icon} \`${item.file}\`: ${item.message}\n`;
                }
              } else {
                commentBody += `✅ **Brak uwag:** Zmiany spełniają rygorystyczne wymagania bezpieczeństwa, warstw i jakości \`AGENTS.md\`.\n`;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            } catch (err) {
              console.error('Błąd podczas generowania recenzji AI:', err);
            }
