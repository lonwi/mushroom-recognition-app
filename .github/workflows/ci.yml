name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    # ubuntu-latest moves to Ubuntu 26 on 19 October 2026. Stay on 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Jest
        uses: actions/cache@v6
        with:
          path: .cache/jest
          key: jest-${{ runner.os }}-node-22-${{ hashFiles('pnpm-lock.yaml', 'jest.config.js', 'jest.setup.js') }}
          restore-keys: |
            jest-${{ runner.os }}-node-22-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install -r training/requirements-dev.txt

      - name: Credit-module typecheck on a repo copy
        env:
          REQUIRE_PNPM: "1"
        run: python training/tests/test_contract.py ManifestAndShipGateTest.test_install_writes_jsonl_and_leaves_the_credit_module_typecheckable

      - name: Test
        run: pnpm test --ci --watchAll=false

  # Separate from `check` so edits there do not overlap this job.
  # Baselines are committed; the job fails only when a finding is new.
  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Copy-paste detection
        run: pnpm duplication

      - name: Unused files, exports, and dependencies
        run: pnpm knip

      - name: Dependency rules
        run: pnpm depcruise

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install -r training/requirements-dev.txt

      - name: Python unit tests
        run: python -m unittest discover -s training/tests -v
