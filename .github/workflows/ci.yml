name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # ubuntu-latest moves to Ubuntu 26 on 19 October 2026. Stay on 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Coverage upload needs actions: write. contents stays read.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Jest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/jest
          key: jest-${{ runner.os }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml', 'jest.config.js', 'jest.setup.js') }}
          restore-keys: |
            jest-${{ runner.os }}-node-${{ hashFiles('.nvmrc') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No published npm fix. pnpm.auditConfig.ignoreCves lists exactly these CVEs.
      # GHSA-86w9-cpqp-85rv / CVE-2026-85393: node-forge via expo>@expo/cli, not the app runtime.
      # GHSA-vfj7-8cjw-p6xm / CVE-2026-93687: braces via jest-expo>micromatch and @expo/metro-file-map.
      # GHSA-hp3w-g68c-fv3c / CVE-2026-97058: sprintf-js via jest>argparse
      #   (used by the Jest CLI, not the app runtime).
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: training/requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install -r training/requirements-dev.txt

      # Runs pnpm exec tsc on a repo copy. The python job has no pnpm, so this stays in check.
      - name: Credit-module typecheck on a repo copy
        env:
          REQUIRE_PNPM: "1"
        run: python training/tests/test_contract.py ManifestAndShipGateTest.test_install_writes_jsonl_and_leaves_the_credit_module_typecheckable

      - name: Test
        run: pnpm test --ci --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          retention-days: 14

  # Separate from `check` so edits there do not overlap this job.
  # Baselines are committed; the job fails only when a finding is new.
  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Copy-paste detection
        run: pnpm duplication

      - name: Unused files, exports, and dependencies
        run: pnpm knip

      - name: Dependency rules
        run: pnpm depcruise

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: training/requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install -r training/requirements-dev.txt

      - name: Python unit tests
        run: python -m unittest discover -s training/tests -v

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Storybook
        run: pnpm build-storybook

      - name: End-to-end tests
        run: pnpm test:e2e
