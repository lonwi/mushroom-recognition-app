name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - rewrite/greenfield

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Typecheck, lint, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Fails on high and critical advisories. This tree has none, so
      # auditConfig.ignoreCves is empty. If a high advisory has no published
      # fix, add the CVE there (pnpm-workspace.yaml) and say why in this comment.
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - name: Quality gates
        run: pnpm quality
        env:
          EXPO_NO_TELEMETRY: '1'
      - name: Zbuduj species.db
        run: pnpm build:species
        env:
          EXPO_NO_TELEMETRY: '1'
          HF_TOKEN_READONLY: ${{ secrets.HF_TOKEN_READONLY }}

  python:
    name: Frozen model contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: ml/requirements-dev.txt
      - name: Install Python test dependencies
        run: python -m pip install -r ml/requirements-dev.txt
      - name: Contract tests
        run: python -m unittest discover -s ml/tests -v

  bundle:
    name: Android JS bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Expo config
        run: pnpm exec expo config --type public
        env:
          EXPO_NO_TELEMETRY: '1'
      - name: Export the Android bundle
        run: pnpm export:android
        env:
          EXPO_NO_TELEMETRY: '1'
          # Drops src/app/dev from the bundle. See metro.config.js.
          NODE_ENV: production
